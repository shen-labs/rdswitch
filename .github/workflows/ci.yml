name: ci

# 每次推送到 main 與每個 pull request 都跑：格式、靜態檢查、測試（三個作業系統）。
# 發佈（打包與簽章）在 release.yml，只在推送 v* 標籤時執行。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: 格式與靜態檢查
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux 相依套件
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Rust 版本與元件（rustfmt、clippy）由 rust-toolchain.toml 決定，本機、CI、發佈都一致
      - name: Rust 工具鏈
        run: rustup install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # --locked：照 Cargo.lock 的版本編譯，鎖定檔過期就失敗，不會悄悄升級相依套件
      - name: cargo clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 前端語法檢查
        run: |
          node --check src/app.js
          node --check src/i18n.js

      - name: 翻譯字典一致性
        run: node scripts/check-i18n.mjs

      - name: 版本號一致性（五個檔案）
        run: node scripts/check-version.mjs

      - name: 腳本的單元測試
        run: node --test scripts/*.test.mjs

  test:
    name: 測試（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Linux 相依套件
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust 工具鏈
        run: rustup install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 更新簽章的整合測試需要真實簽章過的安裝檔，沒有設定環境變數時會自動略過；
      # 這裡跑的是單元測試與其餘整合測試。
      - name: cargo test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
