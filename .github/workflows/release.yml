name: release

# 只在推送 v* 標籤時發佈。不提供手動觸發：手動執行時 github.ref_name 會是分支名稱，
# 會用分支名稱當標籤建立草稿 release。
on:
  push:
    tags: ["v*"]

# 最小權限：整個流程預設唯讀，只有發佈的作業才加上寫入。
# 不依賴儲存庫的預設值（新儲存庫通常是唯讀，建立 Release 會得到 403）。
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # 建立 Release 並上傳安裝檔、簽章與 latest.json
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 相依套件
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 標籤與五個檔案的版本號必須一致，否則在還沒花時間編譯前就讓流程失敗。
      # 標籤名稱用環境變數傳入，不直接嵌進指令（避免特殊字元造成指令注入）。
      - name: 檢查標籤與版本號一致
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-version.mjs "$TAG"

      - run: npm install

      - name: Rust 單元測試
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 把編譯時的本機絕對路徑改寫成通用路徑，避免發佈的執行檔內嵌 runner 的目錄結構
      - name: 設定路徑改寫
        shell: bash
        run: |
          echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=/build --remap-path-prefix=${HOME}/.cargo=/cargo --remap-path-prefix=${HOME}/.rustup=/rustup" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 應用程式內更新的簽章金鑰（必要）：產生方式與設定步驟見 README 的「Releasing and enabling updates」
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 程式碼簽章／公證（可選）：設定後會自動簽章
          # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "rdswitch ${{ github.ref_name }}"
          releaseDraft: true
          # 標籤含 "-"（例如 v0.1.0-rc.1）就標示為預發行
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 由 GitHub 從合併的 PR 自動產生發佈說明；自動更新的橫幅會顯示這份內容
          generateReleaseNotes: true
          # Windows 同時有 MSI 與 NSIS 安裝檔時，latest.json 預設會指向 MSI；
          # 但程式是用 NSIS 安裝的，拿 MSI 更新會裝成另一份獨立的程式，所以要指定 NSIS
          updaterJsonPreferNsis: true
          # tauri.release.conf.json 開啟 createUpdaterArtifacts：產生 .sig 與 latest.json，供應用程式內更新使用
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
