<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>rdswitch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <section id="update-bar" class="updatebar" aria-live="polite" hidden>
    <div class="upd-body">
      <div id="upd-text" class="upd-text"></div>
      <progress id="upd-progress" max="100" hidden></progress>
      <details id="upd-notes" class="upd-notes" hidden>
        <summary data-i18n="upd.notes"></summary>
        <pre id="upd-notes-body"></pre>
      </details>
    </div>
    <div class="upd-actions">
      <button type="button" class="btn pri" id="upd-install"></button>
      <button type="button" class="btn" id="upd-later" data-i18n="upd.later"></button>
    </div>
  </section>

  <header class="appbar">
    <h1>rdswitch</h1>
    <div class="appbar-actions">
      <button class="btn pri" id="add">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="app.add"></span>
      </button>
      <button class="icon-btn" id="open-settings" data-i18n-attr="aria-label:app.settings;title:app.settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div id="admin-warn" class="warn" role="alert" data-i18n="warn.admin" hidden></div>

  <div class="statusbar">
    <div id="cur-info" class="cur-info" aria-live="polite"></div>
    <button class="icon-btn" id="recheck" data-i18n-attr="aria-label:app.recheck;title:app.recheck">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
    </button>
  </div>

  <main class="content">
    <div id="groups"></div>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<div id="menu" class="menu" role="menu" hidden>
  <button role="menuitem" data-m="edit" data-i18n="menu.edit"></button>
  <button role="menuitem" data-m="del" class="danger" data-i18n="menu.delete"></button>
</div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form id="form" novalidate>
    <h2 id="dlg-title"></h2>
    <label class="field"><span data-i18n="dlg.paste_label"></span>
      <textarea id="raw" rows="2" data-i18n-attr="placeholder:dlg.paste_ph"></textarea></label>
    <label class="field"><span data-i18n="dlg.name"></span><input id="f-name" required autocomplete="off"></label>
    <label class="field"><span data-i18n="dlg.server"></span><input id="f-server" placeholder="host:21116" autocomplete="off"></label>
    <label class="field"><span data-i18n="dlg.relay"></span><input id="f-relay" autocomplete="off"></label>
    <label class="field"><span data-i18n="dlg.api"></span><input id="f-api" autocomplete="off"></label>
    <label class="field"><span data-i18n="dlg.key"></span><input id="f-key" autocomplete="off"></label>
    <p class="hint" data-i18n="dlg.hint"></p>
    <p id="dlg-err" class="err" role="alert" hidden></p>
    <div class="dlg-actions">
      <button type="button" class="btn" id="cancel" data-i18n="dlg.cancel"></button>
      <button type="submit" class="btn" value="save" data-i18n="dlg.save"></button>
      <button type="submit" class="btn pri" value="apply" data-i18n="dlg.save_apply"></button>
    </div>
  </form>
</dialog>

<dialog id="settings" aria-labelledby="set-title">
  <h2 id="set-title" data-i18n="set.title"></h2>
  <div class="panel">
    <label class="setting">
      <span class="setting-text">
        <span class="setting-title" data-i18n="set.autostart"></span>
        <span class="setting-desc" data-i18n="set.autostart_desc"></span>
      </span>
      <input type="checkbox" role="switch" id="autostart" class="switch">
    </label>
    <label class="setting">
      <span class="setting-text">
        <span class="setting-title" data-i18n="set.language"></span>
      </span>
      <select id="lang" class="select">
        <option value="auto" data-i18n="set.lang_auto"></option>
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
        <option value="zh-CN">简体中文</option>
        <option value="ja">日本語</option>
      </select>
    </label>
    <div class="setting">
      <span class="setting-text">
        <span class="setting-title" data-i18n="set.version"></span>
        <span class="setting-desc" id="version-desc"></span>
        <span class="setting-desc" id="update-status" aria-live="polite"></span>
      </span>
      <button type="button" class="btn" id="check-update" data-i18n="set.check_update"></button>
    </div>
    <div class="setting">
      <span class="setting-text">
        <span class="setting-title" data-i18n="set.platform"></span>
        <span class="setting-desc" id="platform-desc"></span>
      </span>
    </div>
  </div>
  <p class="hint" data-i18n="set.hint"></p>
  <p id="set-err" class="err" role="alert" hidden></p>
  <div class="dlg-actions">
    <button type="button" class="btn pri" id="close-settings" data-i18n="set.done"></button>
  </div>
</dialog>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
